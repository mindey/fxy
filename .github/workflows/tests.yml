name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Install package
        run: python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

  core-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core only
        run: python -m pip install .

      - name: Verify minimal installed core
        run: |
          python - <<'PY'
          from importlib.metadata import requires, version
          import fxy

          assert version("fxy") == "0.9.0"
          assert list(requires("fxy") or ()) == []
          assert fxy.__all__ == (
              "Error",
              "InvalidProfile",
              "MissingDependency",
              "describe",
              "install",
              "namespace",
              "use",
          )
          assert not hasattr(fxy, "available")
          assert not hasattr(fxy, "main")
          PY

  profile-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core
        run: python -m pip install .

      - name: Inspect pinned CAS profile without dependencies
        run: |
          python - <<'PY'
          import fxy

          source = "mindey/cas@44e0c10f778d8564fa4ff884b5a22ed651f368a5"
          info = fxy.describe(source)
          assert info["requirements"] == ("sympy>=1.13", "mpmath>=1.3")
          assert "solve" in info["bindings"]
          PY

      - name: Install pinned CAS requirements
        run: |
          python - <<'PY'
          import fxy

          fxy.install(
              "mindey/cas@44e0c10f778d8564fa4ff884b5a22ed651f368a5"
          )
          PY

      - name: Realize pinned CAS vocabulary
        run: |
          python - <<'PY'
          import fxy

          cas = fxy.namespace(
              "mindey/cas@44e0c10f778d8564fa4ff884b5a22ed651f368a5"
          )
          x = cas["symbols"]("x")
          assert cas["solve"](cas["Eq"](x**2, 4), x) == [-2, 2]
          PY
