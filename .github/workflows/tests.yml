name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Install package
        run: python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

  cas-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAS extra
        run: python -m pip install ".[cas]"

      - name: Symbolic smoke test
        run: |
          python - <<'PY'
          from fxy.cas import Eq, solve, symbols
          x = symbols("x")
          assert solve(Eq(x**2, 4), x) == [-2, 2]
          PY


  core-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core only
        run: python -m pip install .

      - name: Verify zero runtime dependencies
        run: |
          python - <<'PYCORE'
          from importlib.metadata import requires
          import fxy

          runtime = [
              req for req in (requires("fxy") or ())
              if "extra ==" not in req
          ]
          assert runtime == [], runtime
          assert fxy.available() == ("calc/v1", "cas/v1", "lab/v1")
          PYCORE

  calc-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calculator extra
        run: python -m pip install ".[calc]"

      - name: Calculator smoke test
        run: |
          result=$(python -m fxy "pi**2")
          python - "$result" <<'PYCALC'
          import math
          import sys
          assert abs(float(sys.argv[1]) - math.pi**2) < 1e-12
          PYCALC
