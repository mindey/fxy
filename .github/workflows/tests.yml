name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Install package
        run: python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

  core-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core only
        run: python -m pip install .

      - name: Verify minimal installed core
        run: |
          python - <<'PY'
          from importlib.metadata import requires, version
          import fxy

          assert version("fxy") == "0.9.0"
          assert list(requires("fxy") or ()) == []
          assert fxy.__all__ == (
              "Error",
              "InvalidProfile",
              "MissingDependency",
              "describe",
              "install",
              "namespace",
              "use",
          )
          assert not hasattr(fxy, "available")
          assert not hasattr(fxy, "main")
          PY

  profile-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core
        run: python -m pip install .

      - name: Inspect canonical pinned profiles
        run: |
          python - <<'PY'
          import fxy

          expected = {
              "mindey/calc@v1": {"mp", "sqrt", "quad", "eday"},
              "mindey/cas@v1": {"sp", "Eq", "solve", "symbols", "mp"},
              "mindey/lab@v1": {
                  "np", "pd", "xr", "scipy", "st", "sklearn",
                  "sm", "smf", "sp", "mp", "eday",
              },
          }
          for source, bindings in expected.items():
              info = fxy.describe(source, refresh=True)
              assert bindings <= set(info["bindings"]), (source, info)
          PY

      - name: Realize calculator and CAS profiles
        run: |
          python - <<'PY'
          import fxy

          fxy.install("mindey/calc@v1")
          calc = fxy.namespace("mindey/calc@v1")
          assert abs(float(calc["sqrt"](2)) ** 2 - 2.0) < 1e-12
          assert calc["eday"].now() > 0

          fxy.install("mindey/cas@v1")
          cas = fxy.namespace("mindey/cas@v1")
          x = cas["symbols"]("x")
          assert cas["solve"](cas["Eq"](x**2, 4), x) == [-2, 2]
          PY

  lab-profile-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core
        run: python -m pip install .

      - name: Install canonical lab profile
        run: python -c "import fxy; fxy.install('mindey/lab@v1')"

      - name: Realize canonical lab profile
        run: |
          python - <<'PY'
          import fxy

          lab = fxy.namespace("mindey/lab@v1")
          x = lab["np"].linspace(0.0, 1.0, 5)
          assert x.tolist() == [0.0, 0.25, 0.5, 0.75, 1.0]
          assert abs(float(lab["pd"].Series(x).mean()) - 0.5) < 1e-12
          assert tuple(lab["xr"].DataArray(x, dims=["x"]).dims) == ("x",)
          assert abs(float(lab["st"].norm.cdf(1.96)) - 0.9750021048517795) < 1e-12

          from sklearn.linear_model import LinearRegression
          model = LinearRegression().fit([[0], [1], [2]], [0, 2, 4])
          assert abs(float(model.coef_[0]) - 2.0) < 1e-12

          result = lab["sm"].OLS(
              [1, 3, 5],
              lab["sm"].add_constant([0, 1, 2]),
          ).fit()
          assert [round(float(v), 10) for v in result.params] == [1.0, 2.0]

          u = lab["sp"].symbols("u")
          assert lab["sp"].solve(lab["sp"].Eq(u**2, 9), u) == [-3, 3]
          assert lab["eday"].now() > 0
          PY
