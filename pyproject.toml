[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fxy"
version = "0.9.0"
description = "Reusable import vocabularies for Python."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
authors = [
  {name = "Mindey", email = "mindey@mindey.com"},
]
keywords = ["python", "imports", "namespace", "profiles", "reproducibility"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mindey/fxy"
Repository = "https://github.com/mindey/fxy"
Issues = "https://github.com/mindey/fxy/issues"

[tool.setuptools]
packages = ["fxy"]
