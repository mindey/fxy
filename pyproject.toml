[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxy"
dynamic = ["version"]
description = "Reusable computational namespaces for Python."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.8"
authors = [
  {name = "Mindey", email = "mindey@mindey.com"},
]
keywords = ["cas", "scientific-computing", "sympy", "jupyter", "ipython"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
calc = [
  "mpmath>=1.3",
  "eday",
]
cas = [
  "sympy>=1.13",
  "mpmath>=1.3",
  "eday",
]
lab = [
  "sympy>=1.13",
  "mpmath>=1.3",
  "eday",
  "numpy",
  "pandas",
  "xarray",
  "scipy",
  "scikit-learn",
  "statsmodels",
]
plot = [
  "matplotlib",
  "seaborn",
]
ipython = [
  "ipython",
]
qt = [
  "ipython",
  "ipykernel",
  "jupyter-client",
  "qtconsole",
  "PyQt5",
]
all = [
  "mpmath>=1.3",
  "eday",
  "sympy>=1.13",
  "numpy",
  "pandas",
  "xarray",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "matplotlib",
  "seaborn",
  "ipython",
  "ipykernel",
  "jupyter-client",
  "qtconsole",
  "PyQt5",
  "windows-curses>=2.2.0; platform_system == 'Windows'",
]
test = [
  "coverage",
  "pytest",
  "pytest-cov",
]
release = [
  "build",
  "twine",
]

[project.scripts]
fxy = "fxy:main"

[project.urls]
Homepage = "https://github.com/mindey/fxy"
Repository = "https://github.com/mindey/fxy"
Issues = "https://github.com/mindey/fxy/issues"

[tool.setuptools.dynamic]
version = {attr = "fxy._version.__version__"}

[tool.setuptools.packages.find]
include = ["fxy*"]
exclude = ["docs*", "tests*"]
